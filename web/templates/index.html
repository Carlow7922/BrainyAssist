<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainyAssist - AI Memory Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl">B</div>
            <h1 class="text-xl font-semibold tracking-tight">BrainyAssist <span class="text-xs text-indigo-400 border border-indigo-400 px-1 rounded ml-2">v0.4.0</span></h1>
        </div>
        <div id="status-indicator" class="text-xs text-green-400 flex items-center gap-2">
            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> System Ready
        </div>
    </header>

    <!-- Main Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth">
        <!-- Welcome Message -->
        <div class="flex justify-start">
            <div class="bg-slate-800 p-3 rounded-lg max-w-[80%] border border-slate-700 shadow-sm">
                你好！我是 BrainyAssist。我已经加载了你的核心认知空间。有什么我可以帮你的吗？
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="p-4 bg-slate-800 border-t border-slate-700">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="user-input" 
                   class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" 
                   placeholder="输入问题，或使用 /seed 导入文件...">
            <button id="send-btn" 
                    class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-lg font-medium transition-colors shadow-md">
                发送
            </button>
        </div>
    </footer>

    <script src="/static/chat.js"></script>
</body>
</html>
